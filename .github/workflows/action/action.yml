name: build

runs:
    using: composite

    steps:
    - name: Setup JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 21
        cache: 'gradle'

    - name: Build with Gradle
      shell: bash
      run: ./gradlew assembleDebug

    - uses: actions/upload-artifact@v4
      with:
        name: Google-LatinIME-debug.apk
        path: build/outputs/apk/debug/Google-LatinIME-debug.apk
