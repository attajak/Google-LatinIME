buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
    }
}

apply plugin: 'com.android.application'

android {
    namespace = 'com.android.inputmethod.latin'

    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    // Required if using classes in android.test.runner
    useLibrary 'android.test.runner'

    // Required if using classes in android.test.base
    useLibrary 'android.test.base'

    // Required if using classes in android.test.mock
    useLibrary 'android.test.mock'

    defaultConfig {
        minSdk {
            version = release(24)
        }
        targetSdk {
            version = release(37)
        }
        versionName = '1.0'
        versionCode = 30

        applicationId 'com.android.inputmethod.latin'
        testApplicationId 'com.android.inputmethod.latin.tests'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = false
        signingConfig = signingConfigs.debug
    }
    signingConfigs {
        debug {
            storeFile file('java/shared.keystore')
        }
    }
    buildTypes {
        debug {
            optimization {
                enable = false // Enables code and resource optimizations.
            }
        }
        release {
            optimization {
                enable = true // Enables code and resource optimizations.
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.flags'
        }
    }
    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true
        // Sets Java compatibility to Java 21
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    flavorDimensions ['default']
    sourceSets {
        main {
            res.srcDirs = ['java/res']
            java.srcDirs = ['common/src', 'java/src']
            manifest.srcFile 'java/AndroidManifest.xml'
        }
        androidTest {
            res.srcDirs = ['tests/res']
            java.srcDirs = ['tests/src']
            manifest.srcFile 'tests/AndroidManifest.xml'
        }
    }
    lintOptions {
        checkReleaseBuilds = false
        baseline file('lint-baseline.xml')
    }
    aaptOptions {
        noCompress 'dict'
    }
    externalNativeBuild {
        ndkBuild {
            path 'native/jni/Android.mk'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

repositories {
    // maven { url = "../../../prebuilts/fullsdk-darwin/extras/android/m2repository" }
    // maven { url = "../../../prebuilts/fullsdk-linux/extras/android/m2repository" }
    mavenCentral()
    google()
}

dependencies {
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
//    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation "org.mockito:mockito-core:5.24.0"
    androidTestImplementation 'com.google.dexmaker:dexmaker:1.2'
    androidTestImplementation 'com.google.dexmaker:dexmaker-mockito:1.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.0'
    androidTestImplementation 'androidx.annotation:annotation:1.11.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:deprecation"
}
